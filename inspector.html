<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zootopia Clip Inspector</title>
</head>
<body>
  <canvas id="renderCanvas"></canvas>

  <aside id="panel">
    <h1>Animation Clip Inspector</h1>
    <p id="status">Starting…</p>

    <label class="field">
      <span>Clip</span>
      <select id="clipSelect"></select>
    </label>

    <div class="buttons">
      <button id="loadClip">Load clip</button>
      <button id="playPause">Pause</button>
      <button id="restart">Restart</button>
      <button id="frameActor">Frame actor</button>
    </div>

    <h2>Local correction</h2>

    <div class="row">
      <label>X° <input id="rotX" type="number" value="0" step="5"></label>
      <label>Y° <input id="rotY" type="number" value="0" step="5"></label>
      <label>Z° <input id="rotZ" type="number" value="0" step="5"></label>
    </div>

    <div class="row">
      <label>Scale <input id="scale" type="number" value="1" step="0.05"></label>
      <label>Y offset <input id="offsetY" type="number" value="0" step="0.05"></label>
    </div>

    <div class="buttons">
      <button id="applyCorrection">Apply correction</button>
      <button id="resetCorrection">Reset correction</button>
    </div>

    <h2>Loaded asset</h2>
    <pre id="debug"></pre>
  </aside>

  <script type="module" src="/src/clip-inspector.ts"></script>
</body>
</html>
